services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: huertos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huertos -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  parcel-service:
    build:
      context: .
      dockerfile: parcel-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/parcel_db
      DB_USERNAME: huertos
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  sensor-service:
    build:
      context: .
      dockerfile: sensor-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sensor_db
      DB_USERNAME: huertos
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      PARCEL_SERVICE_URL: http://parcel-service:8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      parcel-service:
        condition: service_started

volumes:
  postgres-data:
